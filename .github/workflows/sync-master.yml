
name: 同步 main → master

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 同步到 master
        run: git push origin HEAD:master --force

      - name: 驗證兩分支一致
        run: |
          git fetch origin master
          MAIN=$(git rev-parse HEAD)
          MASTER=$(git rev-parse origin/master)
          echo "main=$MAIN master=$MASTER"
          [ "$MAIN" = "$MASTER" ] || { echo "::error::兩分支不一致"; exit 1; }

      - name: 健康檢查
        run: |
          [ -f index.html ] || exit 0
          tail -c 200 index.html | grep -q "</html>" \
            || { echo "::error::index.html 結尾缺 </html>，檔案可能不完整"; exit 1; }
          grep -q "預設復原密碼" index.html \
            && { echo "::error::登入頁仍明文顯示復原密碼"; exit 1; }
          echo "健康檢查通過"

      - name: 部署摘要
        run: |
          VER=$(grep -oP "v?\K[0-9]+\.[0-9]+\.[0-9]+" index.html | head -1)
          echo "## 部署完成 · 版本 ${VER:-未偵測}" >> "$GITHUB_STEP_SUMMARY"
          echo "main / master 已確認一致" >> "$GITHUB_STEP_SUMMARY"
